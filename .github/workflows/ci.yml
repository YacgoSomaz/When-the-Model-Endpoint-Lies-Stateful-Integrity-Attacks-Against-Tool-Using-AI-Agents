name: research-safety-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build inert artifact
        run: python scripts/build_safe_artifact.py
      - name: Run unit tests
        run: python -m unittest discover -s lab -p "test_*.py" -v
      - name: Verify inert artifact
        run: python scripts/verify_safe_artifact.py
      - name: Scan repository text
        run: python scripts/scan_secrets.py
